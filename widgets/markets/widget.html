<div class="px-shell" id="px-shell">
  <div class="px-root" id="px-root">
    <div class="px-head">
      <span class="px-label" id="px-label">PIYASA</span>
      <span class="px-age" id="px-age">-</span>
    </div>

    <div class="px-body">
      <div class="px-main">
        <div class="px-hero">
          <span class="px-hero-num" id="px-hero-num">--</span>
          <span class="px-hero-pair" id="px-hero-pair">--</span>
        </div>
        <div class="px-change">
          <span class="px-chip" id="px-change-chip">-</span>
          <span class="px-change-cap" id="px-change-cap">-</span>
        </div>
      </div>

      <div class="px-side">
        <div class="px-card" id="px-card-2">
          <span class="px-card-cap" id="px-cap-2">-</span>
          <span class="px-card-num" id="px-num-2">--</span>
        </div>
        <div class="px-card" id="px-card-coin">
          <span class="px-card-cap" id="px-cap-coin">-</span>
          <span class="px-card-num" id="px-num-coin">--</span>
          <span class="px-card-sub" id="px-sub-coin"></span>
        </div>
      </div>
    </div>

    <svg class="px-spark" id="px-spark" viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true">
      <polygon id="px-spark-area" points="" fill="currentColor" opacity="0.14" stroke="none" />
      <polyline id="px-spark-line" points="" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" />
    </svg>

    <div class="px-foot">
      <span class="px-src" id="px-src">-</span>
      <button class="px-btn" id="px-refresh" type="button">Yenile</button>
    </div>
  </div>
</div>
