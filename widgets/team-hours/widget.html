<div class="tz-shell" id="tz-shell">
  <div class="tz-root" id="tz-root">
    <div class="tz-head">
      <div class="tz-head-id">
        <span class="tz-head-label" id="tz-title">TEAM HOURS</span>
        <span class="tz-head-zone" id="self-zone">--</span>
      </div>
      <div class="tz-head-clock">
        <span class="tz-self-time" id="self-time">--:--</span>
        <span class="tz-self-date" id="self-date">--</span>
      </div>
    </div>

    <div class="tz-rows" id="tz-rows"></div>

    <div class="tz-strip" id="tz-strip">
      <div class="tz-strip-axis" id="tz-axis"></div>
      <div class="tz-strip-track" id="tz-track">
        <div class="tz-track-grid"></div>
        <div class="tz-track-bars" id="tz-bars"></div>
        <div class="tz-track-overlap" id="tz-overlap"></div>
        <div class="tz-track-now" id="tz-now"></div>
      </div>
      <div class="tz-note" id="tz-note">--</div>
    </div>
  </div>
</div>
