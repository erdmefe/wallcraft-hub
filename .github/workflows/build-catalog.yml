name: Auto Build Marketplace Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'shaders/**'
      - 'widgets/**'
      - 'presets/**'
      - 'scripts/build-hub-catalog.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile Catalog
        run: node scripts/build-hub-catalog.js

      - name: Commit & Push if catalog changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(catalog): auto-compile marketplace catalog [skip ci]" && git push)
